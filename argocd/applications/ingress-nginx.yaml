# ingress-nginx：指向本仓库的 kustomize overlay，
# 它以上游 kind provider 目录为远程 base（钉在 tag 上），
# 只额外把两个签证书的 Job 标成 sync hook —— 原因见 overlay 里的注释。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/LeviHowToPlay/GitOpsPractice.git
    targetRevision: main
    path: apps/platform/ingress-nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
