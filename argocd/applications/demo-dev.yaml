# dev：自动同步 + 自愈。CI 只会改这个 overlay 的 image tag。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-dev
  namespace: argocd
spec:
  project: demo
  source:
    repoURL: https://github.com/LeviHowToPlay/GitOpsPractice.git
    targetRevision: main
    path: apps/demo-app/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
