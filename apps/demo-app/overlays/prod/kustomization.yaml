apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base

patches:
  # prod 用独立域名，免得和 dev 抢 localhost 这条路由。
  # prod.localtest.me 会解析到 127.0.0.1，所以 curl http://prod.localtest.me:8080 即可。
  - target:
      kind: Ingress
      name: demo-app
    patch: |
      - op: add
        path: /spec/rules/0/host
        value: prod.localtest.me

# 只有人手动提 PR 才会改这里 —— CI 永远不碰 prod。
images:
  - name: demo-app
    newName: ghcr.io/levihowtoplay/demo-app
    newTag: bootstrap
