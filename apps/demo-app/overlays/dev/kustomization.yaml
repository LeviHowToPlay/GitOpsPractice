apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
- ../../base

# CI 的 bump job 只改下面这三行（kustomize edit set image）。
# 初始 tag 是 bootstrap，镜像还不存在 —— 第一次 push demo-app 之后它就会被替换成真实 git sha。
images:
- name: demo-app
  newName: ghcr.io/levihowtoplay/demo-app
  newTag: 9ee041ef37b7c7c5eb1bf3c2a2eda1a169007a7f
